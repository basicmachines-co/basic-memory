[project]
name = "basic-memory-tau"
version = "0.1.0"
description = "Basic Memory continuity and MCP tools for Tau"
requires-python = ">=3.13"
dependencies = [
    "tau-ai @ git+https://github.com/basicmachines-co/tau@d8216af0b34059839734422d1e39b4c5972d7966",
    "mcp>=2,<3",
    # Match Tau's tested HTTPX API and SOCKS extra, not the 1.0 development release.
    "httpx[socks]>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.12", "ty", "pyyaml>=6.0.1"]

[tool.uv]
package = false
prerelease = "allow"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.tau]
extensions = ["Basic Memory.py"]
